<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blueprint → Schematic · demo video</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:ital,wght@0,400..800;1,400..600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root {
  --bg: #0C0C0D; --bg-2: #161618; --line: #2A2A2E;
  --paper: #F4F2EE; --paper-2: #E9E6DF; --ink: #111113; --mute: #8C8C93; --mute-l: #6B6B72;
  --orange: #FF5B1F; --blue: #3D6BFF; --green: #1FA463; --navy: #0C0C0D;
  --ui: #080809; --ui-2: #111113; --ui-line: #26262A; --ui-text: #D4D4D8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--ui); color: var(--ui-text); font-family: 'Inter Tight', Arial, sans-serif; overflow: hidden; }

/* ---------- app layout ---------- */
#app { display: grid; grid-template-columns: 1fr 360px; grid-template-rows: 1fr auto; height: 100vh; }
#viewport { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; background: #05090E; }
#side { grid-row: 1 / 3; grid-column: 2; background: var(--ui-2); border-left: 1px solid var(--ui-line); display: flex; flex-direction: column; min-height: 0; }
#transport { grid-column: 1; background: var(--ui-2); border-top: 1px solid var(--ui-line); padding: 12px 16px 14px; display: flex; flex-direction: column; gap: 10px; }
body.clean #app { grid-template-columns: 1fr; grid-template-rows: 1fr; }
body.clean #side, body.clean #transport { display: none; }
body.clean { cursor: none; }

/* ---------- the 1920x1080 stage ---------- */
#stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--bg); font-family: 'Inter Tight', Arial, sans-serif; color: var(--paper); }
.layer { position: absolute; inset: 0; visibility: hidden; }
.layer.on { visibility: visible; }
.layer video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
.dark { background: var(--bg); color: var(--paper); }
.light { background: var(--paper); color: var(--ink); }
.abs { position: absolute; }
.mono { font-family: 'JetBrains Mono', 'Courier New', monospace; }
.disp { font-family: 'Inter Tight', Arial, sans-serif; font-weight: 700; letter-spacing: -0.045em; line-height: 0.95; }
.serif { font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-weight: 400; letter-spacing: -0.01em; }
.label { font-family: 'JetBrains Mono', monospace; font-size: 22px; letter-spacing: .04em; text-transform: uppercase; color: var(--mute); }
.o { color: var(--orange); } .m { color: var(--mute); }
.pill { font-family: 'JetBrains Mono', monospace; font-size: 26px; padding: 12px 22px; border-radius: 999px; border: 1.5px solid var(--line); color: var(--paper); white-space: nowrap; background: var(--bg-2); }
.light .pill { border-color: #D6D2C9; background: #fff; color: var(--ink); }
.slam { display: inline-block; }
.plan-svg { display: block; }
.plan-box { position: absolute; overflow: hidden; border-radius: 20px; background: #FFFFFF; }
.dark .plan-box { box-shadow: 0 0 0 1.5px #2A2A2E; }
.light .plan-box { box-shadow: 0 1px 0 rgba(0,0,0,.04), 0 20px 60px rgba(17,17,19,.08); }
.score { font-family: 'Inter Tight', sans-serif; font-weight: 700; font-size: 120px; line-height: 1; letter-spacing: -0.05em; font-variant-numeric: tabular-nums; }
.thought { position: absolute; font-family: 'JetBrains Mono', monospace; font-size: 22px; line-height: 1.5; color: var(--ink); background: #fff; padding: 18px 22px; border-radius: 14px; width: 720px; box-shadow: 0 12px 40px rgba(17,17,19,.14); }
.thought .who { display: block; font-size: 16px; color: var(--mute); letter-spacing: .06em; text-transform: uppercase; margin-bottom: 6px; }
.tag { display: inline-flex; align-items: center; gap: 10px; font-family: 'JetBrains Mono', monospace; font-size: 22px; text-transform: uppercase; letter-spacing: .04em; }
.tag i { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
.card { background: #fff; border-radius: 22px; padding: 34px 36px; color: var(--ink); }
.dark .card { background: var(--bg-2); color: var(--paper); box-shadow: inset 0 0 0 1.5px var(--line); }

/* placeholder card for a clip that hasn't been dropped in yet */
.ph { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 160px; gap: 28px;
      background: #1A1A1C; }
.ph .tag { font-family: 'JetBrains Mono', monospace; font-size: 24px; letter-spacing: .06em; color: var(--orange); }
.ph .file { font-family: 'JetBrains Mono', monospace; font-size: 28px; color: var(--mute); }
.ph .shot { font-family: 'Inter Tight', sans-serif; font-size: 56px; font-weight: 600; line-height: 1.15; letter-spacing: -0.03em; max-width: 1500px; }

/* subtitles */
#subs { position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%); width: max-content; max-width: 1760px; text-align: center; font-size: 56px; font-weight: 600; line-height: 1.2; padding: 12px 30px; border-radius: 16px; background: rgba(12,12,13,.78); color: #fff; z-index: 50; }
#subs:empty, body.nosubs #subs { display: none; }

/* ---------- transport ---------- */
.row { display: flex; align-items: center; gap: 12px; }
button { font: 600 14px 'Inter Tight', sans-serif; color: var(--ui-text); background: #1C1C1F; border: 1px solid var(--ui-line); border-radius: 8px; padding: 7px 12px; cursor: pointer; }
button:hover { background: #2A2A2E; }
button.primary { background: var(--orange); color: #14202B; border-color: var(--orange); min-width: 82px; }
#time { font: 600 15px 'JetBrains Mono', monospace; color: #fff; min-width: 140px; }
#scrub { position: relative; height: 38px; border-radius: 6px; overflow: hidden; cursor: pointer; background: #0C0C0D; display: flex; }
#scrub .seg { height: 100%; border-right: 1px solid #05090E; display: flex; align-items: flex-end; padding: 0 6px 4px; font: 11px 'JetBrains Mono', monospace; color: #9FB3C6; overflow: hidden; white-space: nowrap; }
#scrub .seg.clip { background: #2B2320; } #scrub .seg.clip.missing { background: repeating-linear-gradient(135deg, #2B2320 0 6px, #3A2A22 6px 12px); }
#scrub .seg.anim { background: #1E1E22; }
#scrub .seg.cur { color: #fff; }
#head { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--orange); pointer-events: none; }
.hint { font: 12px 'JetBrains Mono', monospace; color: #6F8499; }

/* ---------- side panel ---------- */
#side h2 { font: 700 13px 'JetBrains Mono', monospace; letter-spacing: .12em; text-transform: uppercase; color: #6F8499; margin: 16px 16px 8px; }
#prompter { margin: 0 16px; padding: 14px 16px; background: #0C0C0D; border-radius: 10px; font-size: 19px; line-height: 1.45; color: #fff; min-height: 150px; }
#prompter .next { display: block; margin-top: 10px; font-size: 14px; color: #6F8499; }
#list { overflow: auto; flex: 1; padding: 0 8px 16px; }
.item { display: grid; grid-template-columns: 54px 1fr; gap: 2px 10px; padding: 9px 10px; border-radius: 8px; cursor: pointer; }
.item:hover { background: #1C1C1F; } .item.cur { background: #2A2A2E; }
.item .t { font: 12px 'JetBrains Mono', monospace; color: #6F8499; padding-top: 2px; }
.item .n { font-weight: 600; color: #fff; font-size: 14px; }
.item .m { grid-column: 2; font: 12px 'JetBrains Mono', monospace; color: #8DA2B6; }
.item .m .ok { color: var(--green); } .item .m .no { color: #E58A8A; }
</style>
</head>
<body>
<div id="app">
  <div id="viewport"><div id="stage"><div id="subs"></div></div></div>
  <div id="transport">
    <div id="scrub"><div id="head"></div></div>
    <div class="row">
      <button id="play" class="primary">▶ Play</button>
      <button id="prev">⏮ Scene</button><button id="next">Scene ⏭</button>
      <span id="time">0:00.0 / 0:00</span>
      <span style="flex:1"></span>
      <button id="subsBtn">Subtitles</button>
      <button id="cleanBtn">Clean view (H)</button>
      <button id="fsBtn">Fullscreen (F)</button>
    </div>
    <div class="hint">Space play/pause · ← → 1 s (Shift 5 s) · [ ] previous/next scene · Home start · H clean view for screen recording · C subtitles · F fullscreen</div>
  </div>
  <div id="side">
    <h2>Voiceover · this scene</h2>
    <div id="prompter"></div>
    <h2>Scenes</h2>
    <div id="list"></div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="data.js"></script>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script src="player.js"></script>
</body>
</html>
